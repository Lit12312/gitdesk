<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
  <title>GitDesk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="8" r="3"></circle>
            <path d="M6 9v6"></path><path d="M18 11c0 4-4 4-9 4"></path>
          </svg>
          GitDesk
        </span>
        <span class="tag">本地 Git 面板</span>
      </div>
      <div class="sidebar-actions">
        <button id="btnAddRepo" class="primary icon" title="添加本地仓库（Ctrl+O）">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          添加仓库
        </button>
        <button id="btnRefreshAll" class="icon" title="刷新全部仓库状态">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          刷新
        </button>
      </div>
      <div id="repoList"></div>
      <div class="sidebar-foot">
        <span id="gitVer" class="truncate">git</span>
        <span id="appVer"></span>
      </div>
    </aside>

    <main id="main">
      <header id="topbar"></header>
      <nav id="tabs"></nav>
      <section id="view"></section>
    </main>
  </div>

  <div id="toasts"></div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
